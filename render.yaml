services:
  - type: web
    name: cineforge-provisioner
    runtime: docker
    dockerfilePath: ./Dockerfile.provisioner
    plan: starter # Starter plan or higher is required for persistent disk storage on Render
    healthCheckPath: /health
    disk:
      name: provisioner-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PORT
        value: 10000
      - key: DATA_DIR
        value: /var/data
      - key: CINEFORGE_DEV_MODE
        value: false
      - key: CINEFORGE_MANAGER_BOT_TOKEN
        sync: false
      - key: CINEFORGE_MANAGER_BOT_USERNAME
        sync: false
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
