# Render Blueprint Specification for Cineforge Go Streamer
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: cineforge-streamer
    runtime: docker
    dockerfilePath: ./streamer/Dockerfile
    dockerContext: ./streamer
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      # Required Telegram API credentials (prompted on deployment)
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      # Telethon session string generated for user session
      - key: TELEGRAM_SESSION_STRING
        sync: false
      # Optional HMAC secret key (leave empty to disable signature verification)
      - key: STREAM_SECRET_KEY
        sync: false
