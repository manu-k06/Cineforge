services:
  - type: web
    name: cineforge-provisioner
    runtime: docker
    dockerfilePath: ./Dockerfile.provisioner
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: CINEFORGE_DEV_MODE
        value: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CINEFORGE_MANAGER_BOT_TOKEN
        sync: false
      - key: CINEFORGE_MANAGER_BOT_USERNAME
        sync: false
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
