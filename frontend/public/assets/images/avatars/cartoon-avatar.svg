<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2a080c" />
      <stop offset="65%" stop-color="#140305" />
      <stop offset="100%" stop-color="#080102" />
    </radialGradient>

    <!-- Mask Crimson Gradient -->
    <linearGradient id="maskGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ff2a38" />
      <stop offset="45%" stop-color="#e50914" />
      <stop offset="100%" stop-color="#8a0006" />
    </linearGradient>

    <!-- Eye Gloss Gradient -->
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f0f6ff" />
      <stop offset="100%" stop-color="#cde2fe" />
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#e50914" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Outer Circle Frame -->
  <circle cx="60" cy="60" r="58" fill="url(#bgGrad)" stroke="#e50914" stroke-width="2.5" stroke-opacity="0.5" />

  <!-- Spider-Man Cartoon Head (Mask) -->
  <g filter="url(#glow)">
    <!-- Head Base Shape -->
    <path d="M 60,18 C 36,18 24,36 24,58 C 24,80 40,102 60,105 C 80,102 96,80 96,58 C 96,36 84,18 60,18 Z" 
          fill="url(#maskGrad)" 
          stroke="#400003" 
          stroke-width="2" />

    <!-- Webbing Lines (Radial from Center) -->
    <path d="M 60,56 L 60,18" stroke="#3b0003" stroke-width="1.6" stroke-linecap="round" opacity="0.75" />
    <path d="M 60,56 L 27,34" stroke="#3b0003" stroke-width="1.6" stroke-linecap="round" opacity="0.75" />
    <path d="M 60,56 L 24,60" stroke="#3b0003" stroke-width="1.6" stroke-linecap="round" opacity="0.75" />
    <path d="M 60,56 L 35,90" stroke="#3b0003" stroke-width="1.6" stroke-linecap="round" opacity="0.75" />
    <path d="M 60,56 L 60,105" stroke="#3b0003" stroke-width="1.6" stroke-linecap="round" opacity="0.75" />
    <path d="M 60,56 L 85,90" stroke="#3b0003" stroke-width="1.6" stroke-linecap="round" opacity="0.75" />
    <path d="M 60,56 L 96,60" stroke="#3b0003" stroke-width="1.6" stroke-linecap="round" opacity="0.75" />
    <path d="M 60,56 L 93,34" stroke="#3b0003" stroke-width="1.6" stroke-linecap="round" opacity="0.75" />

    <!-- Webbing Concentric Arcs -->
    <path d="M 46,24 Q 60,31 74,24" fill="none" stroke="#3b0003" stroke-width="1.5" opacity="0.7" />
    <path d="M 37,34 Q 60,45 83,34" fill="none" stroke="#3b0003" stroke-width="1.5" opacity="0.7" />
    <path d="M 30,50 Q 60,65 90,50" fill="none" stroke="#3b0003" stroke-width="1.5" opacity="0.65" />
    <path d="M 44,93 Q 60,86 76,93" fill="none" stroke="#3b0003" stroke-width="1.5" opacity="0.7" />
    <path d="M 36,80 Q 60,72 84,80" fill="none" stroke="#3b0003" stroke-width="1.5" opacity="0.7" />

    <!-- Left Eye Outer Black Bezel -->
    <path d="M 54,44 C 44,45 32,56 31,69 C 31,77 37,79 43,77 C 49,74 54,62 55,47 Z" 
          fill="#111317" 
          stroke="#050608" 
          stroke-width="1.5" />

    <!-- Left Eye White Gloss Lens -->
    <path d="M 52,47 C 44,48 35,58 34,68 C 34,73 38,75 42,73 C 47,70 51,60 53,50 Z" 
          fill="url(#eyeGrad)" />

    <!-- Right Eye Outer Black Bezel -->
    <path d="M 66,44 C 76,45 88,56 89,69 C 89,77 83,79 77,77 C 71,74 66,62 65,47 Z" 
          fill="#111317" 
          stroke="#050608" 
          stroke-width="1.5" />

    <!-- Right Eye White Gloss Lens -->
    <path d="M 68,47 C 76,48 85,58 86,68 C 86,73 82,75 78,73 C 73,70 69,60 67,50 Z" 
          fill="url(#eyeGrad)" />

    <!-- Eye Highlights -->
    <ellipse cx="44" cy="56" rx="2.5" ry="5" transform="rotate(-20 44 56)" fill="#ffffff" opacity="0.8" />
    <ellipse cx="76" cy="56" rx="2.5" ry="5" transform="rotate(20 76 56)" fill="#ffffff" opacity="0.8" />

    <!-- Mask Top Specular Rim Light -->
    <path d="M 38,23 C 50,19 70,19 82,23" fill="none" stroke="#ff737d" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
  </g>
</svg>
